# ===== Workflow: Backend — Unit Tests =====
name: Backend — Unit Tests

on:
  push:
    branches: [main, develop]
    paths:
      - "backend/**"
      - ".github/workflows/backend-unit-tests.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "backend/**"
      - ".github/workflows/backend-unit-tests.yml"

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: python -m pip install --require-hashes -r backend/requirements/base.txt -r backend/requirements/dev.txt
      - name: Run unit tests
        run: python -m pytest
        working-directory: backend
