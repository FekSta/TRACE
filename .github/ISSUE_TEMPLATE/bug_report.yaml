name: "Bug report"
description: "Report a bug to help us identify and fix issues in the project."
labels: ["bug"]
body:
- type: markdown
  attributes:
    value: |
      Do not include passwords, tokens, private keys, or other secrets. Never
      paste `.env` contents.
- type: textarea
  id: issue_description
  attributes:
    label: Provide a clear and concise description of the issue.
    validations:
      required: true
- type: input
  id: version
  attributes:
    label: Version or commit
    description: Include the release version or `git rev-parse --short HEAD`.
    validations:
      required: true
- type: dropdown
  id: component
  attributes:
    label: Affected component
    options:
    - Backend (FastAPI)
    - Frontend (React)
    - Database / Alembic migrations
    - Docker / Compose
    - Documentation / CI
    validations:
      required: true
- type: input
  id: environment
  attributes:
    label: OS, architecture, and setup
    placeholder: "Ubuntu WSL2, x86_64, Phase 1 local stack via make demo"
    validations:
      required: true
- type: textarea
  id: reproduction
  attributes:
    label: Reproduction steps
    placeholder: "List the smallest reliable sequence that reproduces the issue."
    validations:
      required: true
- type: textarea
  id: error_output
  attributes:
    label: Relevant diagnostics
    description: Include bounded logs (e.g. `docker compose logs backend`) when applicable.
    placeholder: "Paste text directly; attach screenshots only when the issue is visual."
- type: checkboxes
  id: checks
  attributes:
    label: Checklist
    options:
    - label: I removed credentials and unrelated personal data.
      required: true
    - label: I checked for an existing issue describing the same problem.
      required: true
