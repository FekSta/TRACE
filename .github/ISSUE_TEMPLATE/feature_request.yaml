name: "Feature request"
description: "Suggest a new feature or improvement for the project."
labels: ["enhancement"]
body:
- type: markdown
  attributes:
    value: |
      # Feature request
      Explain the user problem and how the proposal fits the project's scope:
      a Phase 1, local-first modular monolith for a campus Lost & Found
      (see `ABOUT.md` and `README.md`). Use an issue for general questions.
- type: textarea
  id: problem
  attributes:
    label: Problem or use case
    placeholder: "What workflow is difficult or unavailable today?"
    validations:
      required: true
- type: textarea
  id: proposed_solution
  attributes:
    label: Describe the solution you'd like
    placeholder: "Provide a clear and concise description."
    validations:
      required: true
- type: textarea
  id: alternatives
  attributes:
    label: Alternatives considered
    description: Explain alternatives and their impact on the current architecture.
- type: checkboxes
  id: scope
  attributes:
    label: Scope check
    options:
    - label: This request is compatible with the project's Phase 1 local-first scope.
      required: true
    - label: I checked for an existing issue or pull request.
      required: true
