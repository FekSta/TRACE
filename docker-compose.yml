# TRACE — local development stack (Phase 1, 100% local)
#
# Services so far: `db` (Postgres, Module 1) and `mailpit` (local email
# catcher, Module 6). Module 8 assembles the full four-service stack by
# adding `backend` and `frontend`.
#
# Usage:
#   docker compose up -d db mailpit   # start Postgres + Mailpit
#   docker compose down -v            # stop and wipe data (back to fresh state)
#   docker compose exec db psql -U trace -d trace   # connect with psql
#
# Credentials come from .env (gitignored). Defaults are inlined with
# ${VAR:-default} interpolation so the file works even when .env is absent
# (e.g. a fresh checkout), with no manual steps beyond `docker compose up db`.

services:
  db:
    image: postgres:16-alpine
    container_name: trace-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trace}
      POSTGRES_USER: ${POSTGRES_USER:-trace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trace_local_password}
    ports:
      - "5432:5432"
    volumes:
      - trace_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trace} -d ${POSTGRES_DB:-trace}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Module 6 — local email catcher. Every email TRACE sends lands here;
  # nothing in Phase 1 talks to a real SMTP relay.
  #   Web UI:  http://localhost:8025   (the inbox)
  #   SMTP:    localhost:1025          (host-side backend, Phase 1)
  #            mailpit:1025            (compose-network backend, Module 8)
  mailpit:
    image: axllent/mailpit:latest
    container_name: trace-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"   # web UI — host browser
      - "1025:1025"   # SMTP — host (Phase 1) and compose network (Module 8)

volumes:
  trace_pgdata:
  # Declared in Module 3 (Item Management storage). The backend service
  # (Module 8) mounts this for the uploads volume; meanwhile
  # LocalDiskStorage writes to backend/uploads/ on the host.
  trace_uploads:
