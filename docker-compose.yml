# TRACE — Phase 1 local development stack.
# Usage: docker compose up db
# Connect: psql -h localhost -p 5432 -U trace -d trace

services:
  db:
    image: postgres:16-alpine
    container_name: trace-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trace}
      POSTGRES_USER: ${POSTGRES_USER:-trace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trace_local_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trace} -d ${POSTGRES_DB:-trace}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
