# TRACE frontend — nginx serving the built bundle (Module 8).
# Listens on 5173 (the same host port as the Vite dev server), so the backend
# CORS allow-list (http://localhost:5173) keeps working unchanged.
server {
    listen 5173;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # SPA routing: react-router paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite emits content-hashed assets under /assets/ — safe to cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
