<svg xmlns="http://www.w3.org/2000/svg"
     width="120"
     height="120"
     viewBox="0 0 120 120">

    <defs>

        <linearGradient id="successGradient"
                        x1="0%"
                        y1="0%"
                        x2="100%"
                        y2="100%">

            <stop offset="0%" stop-color="#4ADE80"/>

            <stop offset="100%" stop-color="#16A34A"/>

        </linearGradient>

        <filter id="shadow"
                x="-20%"
                y="-20%"
                width="140%"
                height="140%">

            <feDropShadow
                dx="0"
                dy="6"
                stdDeviation="6"
                flood-color="#16A34A"
                flood-opacity=".25"/>

        </filter>

    </defs>

    <circle
        cx="60"
        cy="60"
        r="50"
        fill="url(#successGradient)"
        filter="url(#shadow)"/>

    <path
        d="M36 62L53 79L84 47"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="8"
        stroke-linecap="round"
        stroke-linejoin="round"/>

</svg>
