<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRACE | Registration Successful</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">

    <script src="js/app.js" defer></script>
</head>
<body>

<div class="auth-container">

    <section class="success-panel">

        <img src="images/success.svg" class="success-icon" alt="Success">

        <h1>Registration Successful</h1>

        <p>
            Your TRACE account has been created successfully.
            Please verify your email before logging in.
        </p>

        <a href="login.html" class="btn btn-primary">
            Continue to Login
        </a>

        <a href="#" class="btn btn-outline">
            Contact Support
        </a>

    </section>

    <section class="auth-image">

        <img
            src="images/login-side-image.jpeg"
            alt="TRACE Illustration"
        >

        <div class="overlay">

            <div class="badge">

                <span class="material-symbols-outlined">
                    mark_email_read
                </span>

                <span>
                    Verification email sent.
                </span>

            </div>

        </div>

    </section>

</div>

<footer>

    <p>© 2026 TRACE. All rights reserved.</p>

    <nav>
        <a href="#">Privacy</a>
        <a href="#">Terms</a>
        <a href="#">Support</a>
    </nav>

</footer>

</body>
</html>
