<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRACE | Login</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@700;800&display=swap" rel="stylesheet">

    <!-- Material Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">

    <!-- External CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">

    <!-- External JS -->
    <script src="js/auth.js" defer></script>
    <script src="js/app.js" defer></script>
</head>

<body>

<div class="auth-container">

    <!-- Left Side -->
    <section class="auth-form">

        <div>

            <!-- Logo -->
            <div class="logo">
                <img src="images/logo.png" alt="TRACE Logo">
                <h2>TRACE</h2>
            </div>

            <p class="tagline">
                Every lost item leaves a trace.
            </p>

            <div class="heading">
                <h1>Welcome Back</h1>
                <p>
                    Sign in to manage your lost item reports and recovery claims.
                </p>
            </div>

            <form id="loginForm">

                <div class="form-group">
                    <label>Email Address</label>

                    <input
                        type="email"
                        id="email"
                        class="input"
                        placeholder="name@example.com"
                        required
                    >

                    <small class="error" id="emailError"></small>
                </div>

                <div class="form-group">

                    <div class="label-row">
                        <label>Password</label>

                        <a href="forgot-password.html">
                            Forgot Password?
                        </a>
                    </div>

                    <div class="password-field">

                        <input
                            type="password"
                            id="password"
                            class="input"
                            placeholder="••••••••"
                            required
                        >

                        <button
                            type="button"
                            class="toggle-password"
                            data-target="password">

                            <span class="material-symbols-outlined">
                                visibility
                            </span>

                        </button>

                    </div>

                    <small class="error" id="passwordError"></small>

                </div>

                <button class="btn btn-primary" type="submit">
                    Log In
                </button>

            </form>

        </div>

        <div class="bottom-link">
            Don't have an account?

            <a href="register.html">
                Create one
            </a>
        </div>

    </section>

    <!-- Right Side -->
    <section class="auth-image">

        <img
            src="images/login-side-image.jpeg"
            alt="TRACE Login Illustration"
        >

        <div class="overlay">

            <div class="badge">

                <span class="material-symbols-outlined">
                    stars
                </span>

                <span>
                    Recovery starts here.
                </span>

            </div>

        </div>

    </section>

</div>

<footer>

    <p>
        © 2026 TRACE. All rights reserved.
    </p>

    <nav>

        <a href="#">Privacy</a>

        <a href="#">Terms</a>

        <a href="#">Support</a>

    </nav>

</footer>

</body>
</html>
